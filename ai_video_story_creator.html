<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Video Story Creator</title>
<style>
:root{--bg:#090b10;--panel:#121722;--panel2:#171e2b;--line:#283244;--text:#f3f5f8;--muted:#a4afbf;--accent:#a78bfa;--accent2:#6d5ce8;--good:#86d7b0}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0%,#20203c 0,transparent 36%),var(--bg);color:var(--text);font:15px/1.6 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}
header{border-bottom:1px solid var(--line);padding:22px max(20px,calc((100% - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px;background:#090b10d9;position:sticky;top:0;z-index:5;backdrop-filter:blur(14px)}
.brand{font-weight:800;letter-spacing:.2px;font-size:18px}.brand span{color:var(--accent)}.tag{color:var(--muted);font-size:12px}
main{max-width:1100px;margin:34px auto;padding:0 20px 80px}.hero{padding:30px 0 25px}.eyebrow{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase}
h1{font-size:clamp(30px,5vw,48px);line-height:1.12;margin:9px 0 12px;letter-spacing:-1.4px}.lead{color:var(--muted);max-width:690px;margin:0}
.progress{display:flex;gap:7px;margin:20px 0 28px;flex-wrap:wrap}.step{height:5px;flex:1;min-width:35px;border-radius:8px;background:#242c3a}.step.active{background:var(--accent)}
.panel{background:linear-gradient(150deg,#151c29,#10151e);border:1px solid var(--line);border-radius:18px;padding:clamp(18px,3vw,30px);box-shadow:0 20px 60px #0004}
h2{font-size:22px;margin:0 0 7px}h3{font-size:16px;margin:0 0 8px}.muted{color:var(--muted)}.small{font-size:12px;color:var(--muted)}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}button,.btn{border:0;border-radius:10px;padding:11px 17px;font-weight:750;font-size:14px;cursor:pointer;background:var(--accent);color:#100d1d;transition:.18s}button:hover,.btn:hover{transform:translateY(-1px);filter:brightness(1.08)}button.secondary{background:#252e3d;color:var(--text);border:1px solid #344055}button.ghost{background:transparent;border:1px solid var(--line);color:var(--muted)}button:disabled{opacity:.4;cursor:not-allowed;transform:none}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:13px;font-weight:700;color:#d8deea}
input,select,textarea{width:100%;background:#0c111a;color:var(--text);border:1px solid #303b4e;border-radius:9px;padding:11px 12px;font:inherit;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}textarea{min-height:110px;resize:vertical}.full{grid-column:1/-1}
.choice-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin-top:16px}.choice{background:#111824;border:1px solid var(--line);border-radius:12px;padding:14px;text-align:left;color:var(--text)}.choice.selected{border-color:var(--accent);background:#211d36}.choice strong{display:block}.choice span{font-size:12px;color:var(--muted)}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#090e16;border:1px solid #2b3547;border-radius:10px;padding:13px;color:#e4e9f2;font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;margin:8px 0}
.copyrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px}.copy{padding:7px 11px;font-size:12px;background:#282442;color:#e9e3ff}
table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--line)}th{color:#d9d2ff;font-size:12px;text-transform:uppercase;letter-spacing:.6px;background:#171d2a}td{font-size:13px}.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;margin-top:16px}
.scene{border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0;background:#101722}.scenehead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:10px}.scenehead strong{font-size:15px}.promptgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.promptbox{min-width:0}.promptbox pre{min-height:145px}.pill{display:inline-block;border:1px solid #3c355b;color:#d5c9ff;border-radius:20px;padding:3px 9px;font-size:11px}
.notice{border-left:3px solid var(--accent);padding:10px 13px;background:#17172a;color:#c9c4dc;border-radius:0 8px 8px 0;margin-top:14px;font-size:13px}
.hidden{display:none!important}.divider{height:1px;background:var(--line);margin:20px 0}
@media(max-width:700px){header{padding:15px 18px}.grid,.promptgrid{grid-template-columns:1fr}.panel{padding:18px}main{margin-top:18px}.tag{display:none}}
</style>
</head>
<body>
<header><div class="brand">AI <span>Video Story</span> Creator</div><div class="tag">Cinematic prompt workflow</div></header>
<main>
<section class="hero"><div class="eyebrow">Studio kreatif berbasis tahapan</div><h1>Ubah ide menjadi<br><span style="color:var(--accent)">cerita sinematik.</span></h1><p class="lead">Susun naskah, visual style, alur cerita, character sheet, lalu prompt gambar dan video yang konsisten serta siap disalin.</p></section>
<div class="progress" id="progress"></div>
<section class="panel" id="app"></section>
</main>
<script>
const styles=["Realistic","4K Ultrarealistic","Animasi 2D Cartoon","Animasi 2D Cartoon Faceless","Animasi 2D Anime Cartoon","Animasi 3D Cartoon","Animasi 3D Cartoon Faceless","Toy Brick","Claymation Cartoon","Claymation Cartoon Faceless","Voxel","Miniature World","Knitted Cartoon"];
const $=s=>document.querySelector(s);
const state={stage:"start",hasScript:"",script:"",reference:"",brief:{},style:"",story:[],confirmed:false,characterSheet:false,sceneIndex:0,scenes:[]};
const app=$("#app");
function progress(){let names=["Mulai","Naskah","Data video","Visual style","Alur cerita","Konfirmasi","Character sheet","Produksi scene"];let idx={start:0,scriptChoice:1,scriptInput:1,brief:2,style:3,story:4,confirm:5,charsheet:6,scenes:7,done:7}[state.stage]||0;$("#progress").innerHTML=names.map((n,i)=>`<div class="step ${i<=idx?"active":""}" title="${n}"></div>`).join("")}
function render(){progress(); if(state.stage==="start") start(); if(state.stage==="scriptChoice") scriptChoice(); if(state.stage==="scriptInput") scriptInput(); if(state.stage==="brief") brief(); if(state.stage==="style") style(); if(state.stage==="story") story(); if(state.stage==="confirm") confirmStory(); if(state.stage==="charsheet") charsheet(); if(state.stage==="scenes"||state.stage==="done") scenes()}
function start(){app.innerHTML=`<div class="eyebrow">Tahap 01</div><h2>Mulai Kreasi Kamu</h2><p class="muted">Mulai dengan satu pertanyaan untuk menentukan jalur pembuatan video.</p><div class="actions"><button onclick="state.stage='scriptChoice';render()">Mulai Kreasi Kamu</button></div>`}
function scriptChoice(){app.innerHTML=`<div class="eyebrow">Tahap 02</div><h2>Apakah anda sudah memiliki naskah?</h2><p class="muted">Pilih salah satu untuk melanjutkan.</p><div class="choice-grid"><button class="choice" onclick="state.hasScript='yes';state.stage='scriptInput';render()"><strong>Sudah Punya</strong><span>Saya akan mengirimkan naskah lengkap.</span></button><button class="choice" onclick="state.hasScript='no';state.stage='brief';render()"><strong>Belum Punya</strong><span>Saya ingin menyusun ide video dari awal.</span></button></div>`}
function scriptInput(){app.innerHTML=`<div class="eyebrow">Tahap 03</div><h2>Kirim naskah lengkap</h2><p class="muted">Tambahkan referensi gambar jika ada. Referensi bersifat opsional.</p><div class="field"><label>Naskah lengkap</label><textarea id="script" placeholder="Tempelkan naskah lengkap di sini...">${esc(state.script)}</textarea></div><div class="field" style="margin-top:12px"><label>Referensi gambar (opsional)</label><textarea id="ref" placeholder="Jelaskan gambar referensi atau nama file yang akan digunakan...">${esc(state.reference)}</textarea></div><div class="actions"><button onclick="state.script=$('#script').value;state.reference=$('#ref').value;if(!state.script.trim()){alert('Masukkan naskah lengkap terlebih dahulu.');return}state.stage='style';render()">Lanjut ke visual style</button><button class="secondary" onclick="state.stage='scriptChoice';render()">Kembali</button></div>`}
function brief(){app.innerHTML=`<div class="eyebrow">Tahap 03</div><h2>Detail video kamu</h2><p class="muted">Lengkapi data berikut agar alur cerita dan prompt sesuai kebutuhan.</p><div class="grid">
<div class="field full"><label>Judul Video</label><input id="title" placeholder="Contoh: Rahasia di Balik Kota Tua"></div>
<div class="field"><label>Rasio</label><select id="ratio"><option>Landscape 16:9</option><option>Potrait 9:16</option></select></div>
<div class="field"><label>Latar</label><select id="setting"><option>Kantor</option><option>Kerajaan China</option><option>Meja Estetik</option><option>Bebas</option></select></div>
<div class="field"><label>Jumlah Scene</label><input id="count" type="number" min="1" max="30" value="5"></div>
<div class="field"><label>Pilihan Karakter</label><select id="characters"><option>Manusia</option><option>Hewan</option><option>Antropomorfik</option><option>Tanpa Karakter</option><option>Bebas</option></select></div>
<div class="field"><label>Style Editing Prompt Video</label><select id="editing"><option>Iya</option><option>Tidak</option></select></div>
<div class="field"><label>Jenis Dialog</label><select id="dialog"><option>Langsung</option><option>Narator</option></select></div>
<div class="field"><label>Bahasa Dialog</label><input id="dialogLang" value="Bahasa Indonesia"></div>
<div class="field"><label>Bahasa Prompt</label><select id="promptLang"><option>English</option><option>Bahasa Indonesia</option></select></div>
<div class="field full"><label>Referensi Gambar (opsional)</label><textarea id="ref" placeholder="Jelaskan referensi gambar karakter, latar, produk, atau unggah sebagai lampiran pada percakapan AI yang terhubung."></textarea></div></div><div class="actions"><button onclick="saveBrief()">Simpan data dan lanjut</button><button class="secondary" onclick="state.stage='scriptChoice';render()">Kembali</button></div>`}
function saveBrief(){let ids=["title","ratio","setting","count","characters","editing","dialog","dialogLang","promptLang","ref"];ids.forEach(id=>state.brief[id]=$("#"+id).value);if(!state.brief.title.trim()){alert("Judul video wajib diisi.");return}if(+state.brief.count<1||+state.brief.count>30){alert("Jumlah scene harus 1 sampai 30.");return}state.reference=state.brief.ref;state.stage="style";render()}
function style(){app.innerHTML=`<div class="eyebrow">Tahap 04</div><h2>Pilih visual style</h2><p class="muted">Pilih satu gaya visual untuk menjadi acuan seluruh cerita dan prompt.</p><div class="choice-grid">${styles.map(s=>`<button class="choice ${state.style===s?"selected":""}" onclick="state.style='${s}';render()"><strong>${s}</strong><span>${state.style===s?"Terpilih":"Pilih gaya ini"}</span></button>`).join("")}</div><div class="actions"><button ${!state.style?"disabled":""} onclick="makeStory()">Buat alur cerita</button><button class="secondary" onclick="state.stage=state.hasScript==='yes'?'scriptInput':'brief';render()">Kembali</button></div>`}
function makeStory(){let b=state.brief, n=state.hasScript==="yes"?Math.max(3,Math.min(8,(state.script.match(/[.!?]/g)||[]).length||5)):Math.min(+b.count||5,12);let title=b.title||"Cerita dari naskah";let place=b.setting||"latar sesuai naskah";let type=b.characters||"Manusia";let noChar=type==="Tanpa Karakter";let script=state.script;let beats=["Pembuka: perkenalkan dunia, suasana, dan pemantik konflik.","Perkembangan: sebuah petunjuk atau kejadian mengubah keadaan.","Pendalaman: tokoh mengambil keputusan dan menghadapi konsekuensi.","Klimaks: konflik mencapai titik paling menentukan.","Penutup: hasil keputusan memberi resolusi dan kesan akhir."];state.story=Array.from({length:n},(_,i)=>({n:i+1,beat:beats[Math.min(i,4)],place:i===0?`Establishing view ${place}`:i===n-1?`Final view ${place}`:`Area lain di ${place}`,action:i===0?"Kamera memperkenalkan lokasi dan petunjuk awal cerita.":i===n-1?"Suasana mereda, memperlihatkan dampak peristiwa dan penutup yang kuat.":i===Math.floor(n/2)?"Konflik utama muncul melalui sebuah kejadian penting.":"Petunjuk baru mendorong cerita bergerak menuju keputusan berikutnya.",char:noChar?"Tidak ada karakter; fokus pada lokasi dan objek.":`Tokoh utama (${type}) tampil sesuai kebutuhan adegan; detail desain ditetapkan konsisten pada prompt.`,dialog:state.hasScript==="yes"?extractLine(script,i):i===0?"Semuanya bermula dari sesuatu yang tampak biasa.":i===n-1?"Kini semuanya menemukan jawabannya.":i%2?"Kita harus mencari tahu apa yang sebenarnya terjadi.":"Jangan sampai kesempatan ini hilang."}));state.stage="story";render()}
function extractLine(s,i){let a=s.split(/(?<=[.!?])\\s+/).filter(Boolean);return (a[i%Math.max(a.length,1)]||"").split(/\\s+/).slice(0,22).join(" ")||"Tidak ada dialog."}
function story(){let rows=state.story.map(x=>`<tr><td>${x.n}</td><td>${esc(x.beat)}</td><td>${esc(x.place)}<br><span class="small">${esc(x.action)}</span></td><td>${esc(x.char)}</td><td>${esc(trimWords(x.dialog,22))}</td></tr>`).join("");app.innerHTML=`<div class="eyebrow">Tahap 05</div><h2>Alur cerita: ${esc(state.brief.title||"Cerita dari naskah")}</h2><p class="muted">Periksa kesinambungan pembuka, perkembangan, klimaks, dan penutup. Dialog dibatasi maksimal 22 kata per scene.</p><div class="tablewrap"><table><thead><tr><th>Scene</th><th>Fungsi cerita</th><th>Adegan dan latar</th><th>Karakter</th><th>Dialog</th></tr></thead><tbody>${rows}</tbody></table></div><div class="actions"><button onclick="state.stage='confirm';render()">Lanjut ke konfirmasi</button><button class="secondary" onclick="state.stage='style';render()">Ubah visual style</button></div>`}
function confirmStory(){app.innerHTML=`<div class="eyebrow">Tahap 06</div><h2>Konfirmasi alur cerita</h2><p class="muted">Apakah Anda ingin mulai membuat seluruh scene atau merevisi alur cerita?</p><div class="choice-grid"><button class="choice" onclick="state.stage='charsheet';render()"><strong>Mulai membuat seluruh scene</strong><span>Lanjut ke pengaturan referensi karakter.</span></button><button class="choice" onclick="state.stage='story';render()"><strong>Revisi alur cerita</strong><span>Kembali untuk meninjau alur cerita saat ini.</span></button></div>`}
function charsheet(){app.innerHTML=`<div class="eyebrow">Tahap 07</div><h2>Referensi karakter sheet 360°</h2><p class="muted">Apakah Anda ingin membuat prompt referensi gambar karakter sheet 360° sebelum produksi scene?</p><div class="choice-grid"><button class="choice" onclick="state.characterSheet=true;renderSheet()"><strong>Iya</strong><span>Buat prompt character sheet untuk setiap karakter.</span></button><button class="choice" onclick="state.characterSheet=false;state.stage='scenes';generateBatch();render()"><strong>Tidak</strong><span>Langsung lanjut ke pembuatan scene.</span></button></div>`}
function renderSheet(){let count=state.brief.characters==="Tanpa Karakter"?0:1;let p=`Create a clean 360-degree character reference sheet in ${state.style} visual style, ${state.brief.ratio||"Landscape 16:9"} composition. Show the same full-body character in six evenly sized plain grid panels: front view, front three-quarter view, side view, back three-quarter view, back view, and dynamic neutral pose. Add one separate grid panel showing only a detailed head close-up. Plain uncluttered background, consistent anatomy, proportions, face, hairstyle, outfit, footwear and accessories in every view. No labels, no text, no watermark. Character type: ${state.brief.characters||"as defined by story"}. Use the user's supplied visual reference as the highest-priority design guide: ${state.reference||"No image reference supplied; create an original cohesive design."}`;app.innerHTML=`<div class="eyebrow">Tahap 07A</div><h2>Prompt character sheet 360°</h2><p class="muted">Salin prompt berikut untuk membuat lembar referensi karakter. Satu prompt disediakan untuk setiap karakter utama yang terlibat.</p>${count?block("Character 1",p):block("Tanpa karakter", "Tidak ada character sheet karena pilihan karakter adalah Tanpa Karakter.")}<div class="notice">Grid berisi enam panel full-body dan satu panel close-up kepala. Rasio mengikuti pilihan video. Tidak ada gambar yang dibuat di aplikasi ini.</div><div class="actions"><button onclick="state.stage='scenes';generateBatch();render()">Lanjutkan ke pembuatan scene</button></div>`}
function generateBatch(){if(state.scenes.length)return;let total=state.story.length;let end=Math.min(5,total);for(let i=0;i<end;i++)state.scenes.push(buildScene(state.story[i]));state.sceneIndex=end;state.stage=state.sceneIndex>=total?"done":"scenes"}
function buildScene(s){let b=state.brief,ratio=b.ratio||"Landscape 16:9",lang=b.promptLang||"English",styleName=state.style||"Realistic",dialog=trimWords(s.dialog,22),isNarr=b.dialog==="Narator";let charDesc=b.characters==="Tanpa Karakter"?"No characters visible; focus on the environment and objects.":"Main character: adult protagonist, medium height and balanced build, expressive face, neatly styled hair, wearing a practical coordinated outfit with a fitted top, trousers and suitable footwear, plus a simple signature accessory. Maintain identical physical features, clothing and accessories across every scene. Adapt the design to the user's image reference when provided.";let ref=state.reference||"No user reference image supplied.";let image=`${styleName} visual style, cinematic ${ratio} frame. ${charDesc} ${s.action} The setting is ${s.place}. Compose a clear visual hierarchy with foreground, middle ground and background, believable lighting, rich environmental detail, controlled depth of field, coherent color grading and film-quality composition. Preserve continuity with the established story and all supplied references: ${ref} No text, no captions, no watermark.`;
let voice=isNarr?"Narrator voice profile: consistent gender, age and mood across all scenes; calm, clear and expressive.": "Character voice profile: consistent gender, adult age and determined mood across all scenes.";
let spoken=isNarr?"No character dialogue in this video prompt. Narration is provided separately.":`The character speaks exactly this dialogue in ${b.dialogLang||"Bahasa Indonesia"}: "${dialog}"`;
let edit=b.editing==="Iya"?"Automatically connect video editing to dialogue keywords: kinetic typography pop-ups synchronized with emphasized words, relevant B-roll inserts, precise sound effects, and automatic punch-in/zoom on key phrases. Keep typography legible and purposeful; do not cover the subject.":"Use clean cinematic editing without kinetic captions or automated keyword overlays.";
let video=`${styleName} visual style. ${charDesc} Scene action: ${s.action} Location and atmosphere: ${s.place}. ${spoken}. Dialogue language: ${b.dialogLang||"Bahasa Indonesia"}. ${voice} Camera movement: natural cinematic dolly or tracking movement suited to the action, with a deliberate establishing composition and smooth transitions; maintain spatial continuity. Scene audio: realistic environmental ambience and action-specific sound effects only, no music. ${edit} No subtitles and no on-screen subtitle text. Match ${ratio} aspect ratio and preserve visual continuity with the story and reference: ${ref}`;
return {n:s.n,label:s.char.startsWith("Tidak")?"Latar Tempat/objek":"Karakter utama",image,video,dialog: isNarr?"":dialog,narration:isNarr?dialog:""}}
function scenes(){let total=state.story.length;let items=state.scenes.map(s=>`<article class="scene"><div class="scenehead"><strong>Scene ${s.n} — ${esc(s.label)}</strong><span class="pill">${s.n} / ${total}</span></div><div class="promptgrid">${promptBox("Prompt Gambar",s.image)}${promptBox("Prompt Video",s.video)}</div>${s.dialog?`<div class="promptbox"><h3>Kolom Dialog (Karakter)</h3>${code(s.dialog)}</div>`:""}${s.narration?`<div class="promptbox"><h3>Narasi (gabungan dialog)</h3>${code(s.narration)}</div>`:""}</article>`).join("");let done=state.sceneIndex>=total;app.innerHTML=`<div class="eyebrow">Tahap 08</div><h2>${done?"Produksi scene selesai":"Produksi scene"}</h2><p class="muted">Scene dibuat bertahap, maksimal lima scene dalam satu batch. Total: ${total} scene.</p>${items}${done?`<div class="notice">Seluruh ${total} scene telah dibuat. Produksi selesai.</div>`:`<div class="actions"><button onclick="continueScenes()">Lanjutkan 5 scene berikutnya</button></div>`}<div class="actions"><button class="secondary" onclick="copyAll()">Salin seluruh prompt</button></div>`}
function continueScenes(){let total=state.story.length,end=Math.min(state.sceneIndex+5,total);for(let i=state.sceneIndex;i<end;i++)state.scenes.push(buildScene(state.story[i]));state.sceneIndex=end;state.stage=end>=total?"done":"scenes";render()}
function promptBox(title,content){return `<div class="promptbox"><h3>${title}</h3>${code(content)}</div>`}
function code(t){let id="c"+Math.random().toString(36).slice(2);return `<pre id="${id}">${esc(t)}</pre><div class="copyrow"><span class="small">Siap disalin</span><button class="copy" onclick="copyText('${id}')">Salin</button></div>`}
function block(title,content){return `<div class="promptbox"><h3>${title}</h3>${code(content)}</div>`}
function copyText(id){let t=document.getElementById(id).innerText;navigator.clipboard?.writeText(t).then(()=>alert("Teks berhasil disalin."),()=>fallback(t))}
function fallback(t){let a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();alert("Teks berhasil disalin.")}
function copyAll(){let t=state.scenes.map(s=>`SCENE ${s.n}\nPROMPT GAMBAR\n${s.image}\n\nPROMPT VIDEO\n${s.video}\n\nDIALOG\n${s.dialog||s.narration}`).join("\n\n--------------------\n\n");navigator.clipboard?.writeText(t).then(()=>alert("Semua prompt berhasil disalin."),()=>fallback(t))}
function trimWords(t,n){return (t||"").trim().split(/\s+/).slice(0,n).join(" ")}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
render();
</script>
</body></html>
